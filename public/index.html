
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d17">
  <title>X Administrator Control Center</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    input, select, textarea {
      width: 100%;
      max-width: 500px;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #39465b;
      border-radius: 7px;
      background: #0d1726;
      color: white;
    }
    button {
      padding: 11px 16px;
      margin: 5px;
      border: 0;
      border-radius: 7px;
      background: #2459a6;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #3475ce; }
    .panel p { overflow-wrap: anywhere; }
    nav button { width: 100%; margin: 0; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">𝕏 ADMIN
      <small>CONTROL CENTER</small>
    </div>
    <nav>
      <p>Loading administrator panel...</p>
    </nav>
  </aside>

  <main>
    <header>
      <h1 id="pageTitle">Administrator Login</h1>
      <span>● X ADMIN</span>
    </header>
    <div id="content">
      <div class="panel">Connecting to Firebase...</div>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
